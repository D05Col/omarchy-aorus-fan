name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: "`aorus-fan status --json`"
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Shell log
      description: "Output of `journalctl --user --since -5min | grep -i aorus`"
      render: text
  - type: input
    id: omarchy
    attributes:
      label: Omarchy version
